buildscript {
    ext.kotlin_version = '1.6.10'
    repositories {
        // TEMP-BUILD-HACK (revert after APK): offline file repo seeded via curl,
        // because the sandbox blocks Java TLS to Maven Central. — panto 2026-10-21
        maven { url = uri("file:///home/hatch/workspace/thansohoc-build/localrepo") }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
